name: Testing

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    - name: Start Docker
      run: docker compose up -d --build

    - name: Wait for app
      run: sleep 20

    - name: Run tests
      run: docker compose run --rm app